<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <title>枪剑竞技场</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game" width="1280" height="720" aria-label="枪剑竞技场"></canvas>
      <div id="hud" aria-live="polite">
        <div class="health-row">
          <div class="health-track"><div id="health-fill"></div></div>
          <span id="health-value">100</span>
        </div>
        <div id="active-item"><span id="active-item-code">手</span><strong id="active-item-name">手枪</strong><span id="weapon-ready">就绪</span></div>
        <div id="player-stats"><span id="kills">击败 0</span><span id="deaths">倒下 0</span></div>
        <form id="name-form" autocomplete="off">
          <label for="name-input">昵称</label>
          <input id="name-input" maxlength="16" autocomplete="nickname" placeholder="输入昵称" aria-label="玩家昵称" />
          <button type="submit">保存</button>
        </form>
      </div>
      <div id="score"><span id="player-count">1</span><span id="connection">连接中</span></div>
      <ol id="kill-feed" aria-live="polite"></ol>
      <ol id="leaderboard" aria-label="对战排名"></ol>
      <section id="chat-panel" aria-label="全局聊天">
        <button id="chat-open" type="button">全局聊天</button>
        <ol id="chat-log" aria-live="polite"></ol>
        <form id="chat-form" hidden>
          <input id="chat-input" maxlength="240" autocomplete="off" placeholder="输入消息" aria-label="聊天消息" />
        </form>
      </section>
      <div id="notice" role="status" hidden></div>
      <div id="respawn" hidden>正在重生</div>
      <div id="inventory" aria-label="物品栏"></div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
