<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <title>Gun & Sword Arena</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game" width="1280" height="720" aria-label="Gun and Sword Arena"></canvas>
      <div id="hud" aria-live="polite">
        <div class="health-track"><div id="health-fill"></div></div>
        <span id="health-value">100</span>
      </div>
      <div id="score"><span id="player-count">1</span><span id="connection">CONNECTING</span></div>
      <div id="respawn" hidden>REDEPLOYING</div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
